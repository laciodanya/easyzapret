name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching src-tauri/tauri.conf.json (for example v0.6.2)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_meta.outputs.tag }}
      release_sha: ${{ steps.release_meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # A manual run may only rebuild an existing immutable tag. This
          # prevents replacing release assets with binaries from another ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      - name: Resolve and validate release tag
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_TAG"
          fi
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => console.log(JSON.parse(s).packages[0].version));")
          if [ "$TAURI_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAURI_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tauri=$TAURI_VERSION package=$PACKAGE_VERSION cargo=$CARGO_VERSION"
            exit 1
          fi
          if [ "$TAG" != "v$TAURI_VERSION" ]; then
            echo "::error::Release tag $TAG does not match application version v$TAURI_VERSION"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::$TAG is not an existing Git tag"
            exit 1
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "${GITHUB_REF:-}" != "refs/tags/$TAG" ]; then
            echo "::error::Release workflow must run from refs/tags/$TAG, got ${GITHUB_REF:-unknown}"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ -z "$TAG_SHA" ] || [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "::error::Checked out commit $HEAD_SHA does not match tag $TAG ($TAG_SHA)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build Tauri app
        shell: bash
        env:
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail
          set -o pipefail
          npm run tauri build -- --verbose --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee build.log

      - name: Sign updater artifact
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          key="$(trim "$RAW_SIGNING_KEY")"
          pass="$(trim "$RAW_SIGNING_PASSWORD")"
          if [ -z "$key" ] || [ -z "$pass" ]; then
            echo "::error::Tauri signing key or password is empty"
            exit 1
          fi
          if ! echo "$key" | grep -q "encrypted secret key"; then
            key="$(printf '%s' "$key" | tr -d '\n')"
          fi
          export TAURI_SIGNING_PRIVATE_KEY="$key"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$pass"
          printf 'signing smoke test' > smoke.txt
          npx tauri signer sign smoke.txt
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          EXE=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*-setup.exe' -print -quit)
          if [ -z "$EXE" ]; then
            echo "::error::NSIS bundle was not produced"
            exit 1
          fi
          npx tauri signer sign "$EXE"

      - name: Verify updater signatures
        shell: bash
        run: |
          set -euo pipefail
          UPDATER_PUBLIC_KEY=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --example verify_updater_signature -- smoke.txt smoke.txt.sig "$UPDATER_PUBLIC_KEY"
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          EXE=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*-setup.exe' -print -quit)
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --example verify_updater_signature -- "$EXE" "$EXE.sig" "$UPDATER_PUBLIC_KEY"
          rm -f smoke.txt smoke.txt.sig

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Generate latest.json
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          EXE=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*-setup.exe' -print -quit)
          SIG="$EXE.sig"
          if [ -z "$EXE" ] || [ ! -f "$SIG" ]; then
            echo "::error::Signed NSIS bundle was not produced"
            exit 1
          fi
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXE_NAME=$(basename "$EXE")
          SIG_CONTENT=$(tr -d '\n\r' < "$SIG")
          URL="https://github.com/laciodanya/easyzapret/releases/download/${RELEASE_TAG}/${EXE_NAME}"
          export VERSION SIG_CONTENT URL RELEASE_TAG
          node <<'NODE'
          const fs = require("fs");
          const manifest = {
            version: process.env.VERSION,
            notes: `EasyZapret ${process.env.RELEASE_TAG}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": {
                signature: process.env.SIG_CONTENT,
                url: process.env.URL,
              },
            },
          };
          fs.writeFileSync(
            "src-tauri/target/release/bundle/nsis/latest.json",
            JSON.stringify(manifest, null, 2),
          );
          NODE

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: release-bundle

      - name: Publish draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build-windows.outputs.release_tag }}
          name: EasyZapret ${{ needs.build-windows.outputs.release_tag }}
          target_commitish: ${{ needs.build-windows.outputs.release_sha }}
          draft: true
          generate_release_notes: false
          body: |
            ## What's Changed

            - Автопилот замечает смену сети и сначала проверяет стратегию, которая уже работала в ней
            - Обновления IPSet и hosts показываются в общей плашке обновлений
            - Обновление hosts сохраняет пользовательские записи и создаёт резервную копию
            - Обновление IPSet сохраняет выбранный режим фильтра

            **Full Changelog**: https://github.com/laciodanya/easyzapret/compare/v0.6.1...v0.6.2
          fail_on_unmatched_files: true
          files: release-bundle/*
