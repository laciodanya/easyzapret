name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:versions
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: easyzapret-windows
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Setup Node for release asset checks
        if: inputs.release_tag != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prepare verified VPN archives for release tests
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          node scripts/prepare-vpn-assets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "EASYZAPRET_TEST_VPN_ARCHIVES=$env:GITHUB_WORKSPACE/src-tauri/vpn-components" >> $env:GITHUB_ENV
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked --all-features
